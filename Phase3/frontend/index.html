
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStore | Welcome</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>

<body>

    <main class="welcome-container">

        <div class="welcome-card">

            <div class="store-icon">
                <i data-lucide="shopping-basket"></i>
            </div>

            <h1>Welcome to SmartStore</h1>

            <p class="subtitle">
                Your smart, fast, and convenient shopping experience.
            </p>

            <div class="welcome-features">

                <div class="feature">
                    <i data-lucide="scan-line"></i>
                    <p>Automatic RFID Scanning</p>
                </div>

                <div class="feature">
                    <i data-lucide="shopping-cart"></i>
                    <p>Real-Time Shopping Cart</p>
                </div>

                <div class="feature">
                    <i data-lucide="zap"></i>
                    <p>Quick Self-Checkout</p>
                </div>

            </div>

            <a href="cart.html" class="primary-btn">
                Start Shopping
                <i data-lucide="arrow-right"></i>
            </a>

            <p class="footer-text">
                SmartStore IoT | Phase 3
            </p>

        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
