<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title_index">SmartStore | Welcome</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <script src="i18n.js"></script>
    <script src="qol.js"></script>
</head>

<body>

    <main class="welcome-container">

        <div class="welcome-card">

            <div class="store-icon">
                <i data-lucide="shopping-basket"></i>
            </div>

            <h1 data-i18n="index_h1">Welcome to SmartStore</h1>

            <p class="subtitle" data-i18n="index_sub">
                Your smart, fast, and convenient shopping experience.
            </p>

            <div class="welcome-features">

                <div class="feature">
                    <i data-lucide="scan-line"></i>
                    <p data-i18n="feat_rfid">Automatic RFID Scanning</p>
                </div>

                <div class="feature">
                    <i data-lucide="shopping-cart"></i>
                    <p data-i18n="feat_cart">Real-Time Shopping Cart</p>
                </div>

                <div class="feature">
                    <i data-lucide="zap"></i>
                    <p data-i18n="feat_checkout">Quick Self-Checkout</p>
                </div>

            </div>

            <a href="cart.html" class="primary-btn">
                <span data-i18n="start_shopping">Start Shopping</span>
                <i data-lucide="arrow-right"></i>
            </a>

            <div class="welcome-account-links">
                <p data-i18n="already_member">Already a member?</p>

                <a href="login.html" data-i18n="login_to_account">Log in to your account</a>

                <p data-i18n="new_to">New to SmartStore?</p>

                <a href="register.html" data-i18n="create_account">Create an account</a>
            </div>

            <p class="footer-text">
                SmartStore IoT | Phase 3
            </p>

        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
