<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title_register">SmartStore | Register</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <script src="i18n.js"></script>
    <script src="qol.js"></script>
</head>

<body>

    <main class="account-page">

        <section class="account-card">

            <div class="store-icon">
                <i data-lucide="user-plus"></i>
            </div>

            <h1 data-i18n="reg_h1">Create an Account</h1>

            <p class="subtitle" data-i18n="reg_sub">
                Join SmartStore and start earning loyalty points.
            </p>

            <form id="register-form">

                <label for="name" data-i18n="fullname">Full name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name" data-i18n-placeholder="name_ph"
                    required
                >

                <label for="email" data-i18n="email_label">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email" data-i18n-placeholder="email_ph"
                    required
                >

                <label for="password" data-i18n="password_label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters" data-i18n-placeholder="password_new_ph"
                    minlength="8"
                    required
                >

                <button type="submit" class="primary-btn account-submit">
                    <span data-i18n="reg_btn">Create Account</span>
                    <i data-lucide="arrow-right"></i>
                </button>

            </form>

            <p id="form-message" class="account-message"></p>

            <div class="account-links">
                <p data-i18n="have_account">Already have an account?</p>
                <a href="login.html" data-i18n="login_short">Log in</a>

                <a href="index.html" data-i18n="back_home">Back to home</a>
            </div>

        </section>

    </main>

    <script src="account.js"></script>
    <script>lucide.createIcons();</script>

</body>
</html>
